name: Bug report
description: Report a reproducible problem with Zoysh
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Zoysh. Never include API keys.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe sequence of commands or configuration that reproduces the issue.
    validations:
      required: true
  - type: input
    id: zoysh
    attributes:
      label: Zoysh version
      placeholder: Output of yo --version
    validations:
      required: true
  - type: input
    id: zsh
    attributes:
      label: zsh version and operating system
      placeholder: zsh 5.9 on Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - local
        - anthropic
        - openai
        - openrouter
        - kimi
        - deepseek
        - qwen
        - zai
        - not provider-related
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Remove API keys, tokens, private paths, and sensitive prompt content.
      render: text
