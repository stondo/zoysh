name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install zsh on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Show dependency versions
        run: |
          zsh --version
          curl --version | head -1
          python3 --version

      - name: Run release checks
        run: make check

      - name: Verify staged install
        run: |
          stage="$(mktemp -d)"
          make install DESTDIR="$stage" PREFIX=/usr/local
          test -f "$stage/usr/local/share/zsh/plugins/zoysh/zoysh.plugin.zsh"

  module:
    name: Native module (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh libcurl4-openssl-dev libncurses-dev

      - name: Prepare a configured zsh source tree
        run: |
          git clone --depth 1 --branch zsh-5.9 https://github.com/zsh-users/zsh "$HOME/zsh-src"
          cd "$HOME/zsh-src"
          ./Util/preconfig
          # zsh's configure probes terminal capabilities and fails with
          # "no controlling tty" in CI; script(1) lends it a pty. The
          # zsh.mdh rule lives in the generated Makemod, not Src/Makefile.
          script -qec "./configure --enable-multibyte --with-term-lib=ncursesw" /dev/null
          make -j"$(nproc)" -C Src Makemod
          make -C Src -f Makemod zsh.mdh

      - name: Build the module
        run: make module ZSH_SRC="$HOME/zsh-src"

      - name: Run gated module tests
        run: make check-module ZSH_SRC="$HOME/zsh-src"
