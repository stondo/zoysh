name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install zsh on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Show dependency versions
        run: |
          zsh --version
          curl --version | head -1
          python3 --version

      - name: Run release checks
        run: make check

      - name: Verify staged install
        run: |
          stage="$(mktemp -d)"
          make install DESTDIR="$stage" PREFIX=/usr/local
          test -f "$stage/usr/local/share/zsh/plugins/zoysh/zoysh.plugin.zsh"
