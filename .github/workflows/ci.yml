name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zsh-version: ["5.8", "5.9"]
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh curl python3 jq

      - name: Syntax check
        run: zsh -n zoysh.plugin.zsh

      - name: Plugin loads without error
        run: zsh -ic 'source zoysh.plugin.zsh; echo "loaded OK"'

      - name: Idempotency (double source)
        run: zsh -ic 'source zoysh.plugin.zsh; source zoysh.plugin.zsh; echo "double OK"'

      - name: Non-interactive safety
        run: zsh -c 'source zoysh.plugin.zsh; echo "non-interactive OK"'

      - name: Help output
        run: zsh -ic 'source zoysh.plugin.zsh; yo --help'

      - name: Session clear
        run: zsh -ic 'source zoysh.plugin.zsh; yo --clear'
